---
# Read-only. Sets __lh_ap_kernel (bool), __lh_ap_profiles (name -> mode), __lh_ap_unit (systemd status),
# __lh_ap_cmdline (list), __lh_ap_complain (parent profiles in complain mode, not allowed).
- name: Gather package facts
  ansible.builtin.package_facts:

- name: Read the kernel's AppArmor switch
  ansible.builtin.slurp:
    src: /sys/module/apparmor/parameters/enabled
  register: __lh_ap_enabled_raw
  failed_when: false
  check_mode: false

# The kernel switch alone is not enough: inside a container the securityfs interface is missing and
# apparmor.service asserts on it.
- name: Look for the AppArmor securityfs interface
  ansible.builtin.stat:
    path: /sys/kernel/security/apparmor
  register: __lh_ap_securityfs

- name: Read the kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: __lh_ap_cmdline_raw
  failed_when: false
  check_mode: false

- name: Look for aa-status
  ansible.builtin.stat:
    path: /usr/sbin/aa-status
  register: __lh_ap_aa_status

- name: Read the loaded profiles
  ansible.builtin.command: aa-status --json
  register: __lh_ap_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: __lh_ap_aa_status.stat.exists

- name: Query the apparmor service
  ansible.builtin.systemd_service:
    name: apparmor
  register: __lh_ap_unit
  failed_when: false
  check_mode: false

- name: Work out kernel state and the complain-mode parents
  ansible.builtin.set_fact:
    __lh_ap_kernel: >-
      {{ (__lh_ap_enabled_raw.content | default('') | b64decode | trim) == 'Y'
         and __lh_ap_securityfs.stat.exists }}
    __lh_ap_cmdline: "{{ __lh_ap_cmdline_raw.content | default('') | b64decode | trim | split(' ') }}"
    __lh_ap_profiles: >-
      {{ (__lh_ap_status.stdout | from_json).profiles
         if (__lh_ap_status.rc | default(1)) == 0 and (__lh_ap_status.stdout | default('') | length > 0) else {} }}

- name: List the complain-mode parent profiles that are not allowed
  ansible.builtin.set_fact:
    __lh_ap_complain: >-
      {{ __lh_ap_profiles | dict2items | selectattr('value', 'eq', 'complain') | map(attribute='key')
         | map('split', '//') | map('first') | unique
         | difference(linux_hardening_apparmor_complain_allowed) | sort }}
