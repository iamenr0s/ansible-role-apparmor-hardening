---
- name: audit | Gather AppArmor state
  ansible.builtin.include_tasks: facts.yml

- name: audit | Start with no findings
  ansible.builtin.set_fact:
    linux_hardening_apparmor_findings: []

- name: audit | Report missing packages
  ansible.builtin.set_fact:
    linux_hardening_apparmor_findings: >-
      {{ linux_hardening_apparmor_findings + [{'key': 'package ' ~ item, 'expected': 'installed',
         'actual': 'missing', 'fixable': true}] }}
  loop: [apparmor, apparmor-utils]
  when: item not in ansible_facts['packages']

- name: audit | Report AppArmor disabled in the kernel
  ansible.builtin.set_fact:
    linux_hardening_apparmor_findings: >-
      {{ linux_hardening_apparmor_findings + [{'key': 'AppArmor in the kernel', 'expected': 'enabled',
         'actual': 'disabled (' ~ __lh_ap_reason ~ ')', 'fixable': false}] }}
  vars:
    __lh_ap_why: >-
      {{ (['apparmor=0'] | intersect(__lh_ap_cmdline))
         + (__lh_ap_cmdline | select('match', '^security=') | reject('eq', 'security=apparmor') | list) }}
    __lh_ap_reason: >-
      {{ __lh_ap_why | join(', ') ~ ' on the kernel command line; reported only: bootloader, needs a reboot'
         if __lh_ap_why
         else 'reported only: securityfs is not available, e.g. in a container'
         if not __lh_ap_securityfs.stat.exists
         else 'reported only: kernel or bootloader' }}
  when: not __lh_ap_kernel | bool

- name: audit | Check the running AppArmor
  when: __lh_ap_kernel | bool
  block:
    # ConditionResult "no" means systemd skipped the start on purpose (no kernel interface), not a failure.
    - name: audit | Report apparmor.service not enabled and active
      ansible.builtin.set_fact:
        linux_hardening_apparmor_findings: >-
          {{ linux_hardening_apparmor_findings + [{'key': 'apparmor.service', 'expected': 'enabled and active',
             'actual': __lh_ap_st.get('UnitFileState', 'missing') ~ ' / ' ~ __lh_ap_st.get('ActiveState', 'missing'),
             'fixable': true}] }}
      vars:
        __lh_ap_st: "{{ __lh_ap_unit.status | default({}) }}"
      when: >-
        __lh_ap_st.get('UnitFileState', '') != 'enabled'
        or (__lh_ap_st.get('ActiveState', '') != 'active' and __lh_ap_st.get('ConditionResult', '') != 'no')

    - name: audit | Report no loaded profiles
      ansible.builtin.set_fact:
        linux_hardening_apparmor_findings: >-
          {{ linux_hardening_apparmor_findings + [{'key': 'loaded profiles', 'expected': 'at least one',
             'actual': 'none loaded (reported only)', 'fixable': false}] }}
      when:
        - __lh_ap_aa_status.stat.exists
        - __lh_ap_profiles | length == 0

    - name: audit | Report complain-mode profiles (cis_level2)
      ansible.builtin.set_fact:
        linux_hardening_apparmor_findings: >-
          {{ linux_hardening_apparmor_findings + [{'key': 'profile ' ~ item, 'expected': 'enforce',
             'actual': 'complain' ~ (' (could not be enforced)' if __lh_ap_unfixable else ''),
             'fixable': not __lh_ap_unfixable}] }}
      vars:
        __lh_ap_unfixable: "{{ item in (__lh_ap_failed | default([])) }}"
      loop: "{{ __lh_ap_complain }}"
      when: linux_hardening_profile == 'cis_level2'

- name: audit | Report apparmor_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_apparmor_findings | length == 0 else linux_hardening_apparmor_findings }}"

# After remediation only fixable findings fail the run.
- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "apparmor_hardening found {{ __lh_ap_blocking | length }} deviation(s)."
  vars:
    __lh_ap_blocking: >-
      {{ linux_hardening_apparmor_findings | selectattr('fixable') | list if __lh_ap_audit_fatal | default(false)
         else linux_hardening_apparmor_findings if linux_hardening_fail_on_error | bool
         else [] }}
  when: __lh_ap_blocking | length > 0
