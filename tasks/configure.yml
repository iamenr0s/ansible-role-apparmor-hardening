---
- name: configure | Gather AppArmor state
  ansible.builtin.include_tasks: facts.yml

- name: configure | Refuse to enforce complain-mode profiles without consent
  ansible.builtin.assert:
    that: linux_hardening_apparmor_confirm_enforce | bool
    fail_msg: >-
      {{ __lh_ap_complain | length }} profile(s) are in complain mode and cis_level2 would enforce them
      ({{ __lh_ap_complain | join(', ') | truncate(200) }}). Enforcing can break the applications they confine.
      Leave some out with linux_hardening_apparmor_complain_allowed, then set
      linux_hardening_apparmor_confirm_enforce: true to proceed.
    quiet: true
  when: linux_hardening_profile == 'cis_level2' and __lh_ap_complain | length > 0

- name: configure | Ensure the AppArmor packages are installed
  ansible.builtin.apt:
    name: [apparmor, apparmor-utils]
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: __lh_ap_pkg_result

# Starting needs the kernel interface (apparmor.service asserts on it); enabling does not.
- name: configure | Enable apparmor.service, and start it when the kernel interface is there
  ansible.builtin.systemd_service:
    name: apparmor
    enabled: true
    state: "{{ 'started' if __lh_ap_kernel | bool else omit }}"
  # In check mode a package that would be installed has no unit yet.
  when: not (ansible_check_mode and __lh_ap_pkg_result is changed)

- name: configure | Enforce the complain-mode profiles
  ansible.builtin.include_tasks: enforce.yml
  when: linux_hardening_profile == 'cis_level2'
