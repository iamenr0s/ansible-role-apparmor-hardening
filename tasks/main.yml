---
# audit: read-only. remediate: packages, apparmor.service, and (cis_level2, with consent) enforce complain profiles.
- name: Run apparmor_hardening
  when: linux_hardening_apparmor_enabled | bool
  block:
    - name: Validate linux_hardening_mode
      ansible.builtin.assert:
        that: linux_hardening_mode in ['audit', 'remediate']
        fail_msg: "linux_hardening_mode must be 'audit' or 'remediate', got '{{ linux_hardening_mode }}'"
        quiet: true

    - name: Skip other OS families
      ansible.builtin.set_fact:
        linux_hardening_apparmor_findings: []
      when: ansible_facts['os_family'] != 'Debian'

    - name: Say why the role was skipped
      ansible.builtin.debug:
        msg: "apparmor_hardening applies to the Debian family; {{ ansible_facts['os_family'] }} is skipped (see selinux_hardening)."
      when: ansible_facts['os_family'] != 'Debian'

    - name: Run on the Debian family
      when: ansible_facts['os_family'] == 'Debian'
      block:
        - name: Audit (read-only)
          ansible.builtin.include_tasks: audit.yml
          when: linux_hardening_mode == 'audit'

        - name: Remediate
          when: linux_hardening_mode == 'remediate'
          block:
            - name: Require explicit remediation confirmation
              ansible.builtin.assert:
                that: linux_hardening_confirm_remediation | bool
                fail_msg: >-
                  Remediation changes AppArmor. Set linux_hardening_confirm_remediation: true
                  to proceed (run with linux_hardening_mode: audit to preview).
                quiet: true

            - name: Configure
              ansible.builtin.include_tasks: configure.yml

            - name: Verify effective configuration
              ansible.builtin.include_tasks: audit.yml
              vars:
                __lh_ap_audit_fatal: true
              when: linux_hardening_verify | bool
