---
argument_specs:
  main:
    short_description: Audit and enforce AppArmor (packages, service, profile modes); skipped on other OS families.
    options:
      linux_hardening_mode:
        type: str
        default: audit
        choices: [audit, remediate]
        description: "audit is read-only."
      linux_hardening_confirm_remediation:
        type: bool
        default: false
        description: "Must be true before remediate changes anything."
      linux_hardening_profile:
        type: str
        default: cis_level1
        choices: [baseline, cis_level1, cis_level2]
        description: "cis_level2 also requires every profile to be enforcing."
      linux_hardening_verify:
        type: bool
        default: true
        description: "Re-audit after remediation."
      linux_hardening_fail_on_error:
        type: bool
        default: true
        description: "Fail the play when audit finds deviations."
      linux_hardening_apparmor_enabled:
        type: bool
        default: true
        description: "Run the role."
      linux_hardening_apparmor_confirm_enforce:
        type: bool
        default: false
        description: "Allow switching complain-mode profiles to enforce (cis_level2)."
      linux_hardening_apparmor_complain_allowed:
        type: list
        elements: str
        default: []
        description: "Parent profile names to leave in complain mode."
